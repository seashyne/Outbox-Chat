<!doctype html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Outbox Chat</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/chat.css" />
  <link rel="stylesheet" href="/css/overlays.css" />
  <link rel="stylesheet" href="/css/settings.css" />
  <link rel="stylesheet" href="/css/meeting.css" />
</head>
<body>
  <div id="login" class="login-overlay">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </div>
        <div class="login-brand-text">
          <h1>Outbox Chat</h1>
          <p class="login-sub">พื้นที่สนทนาสำหรับทีมและคอมมูนิตี้ของคุณ</p>
        </div>
      </div>

      <div class="auth-tabs" role="tablist" aria-label="ตัวเลือกการยืนยันตัวตน">
        <button type="button" class="auth-tab active" id="tabLogin" role="tab" aria-selected="true">เข้าสู่ระบบ</button>
        <button type="button" class="auth-tab" id="tabRegister" role="tab" aria-selected="false">สมัครสมาชิก</button>
      </div>

      <form id="authForm" class="auth-fields" novalidate>
        <div class="field-group">
          <label for="usernameInput">ชื่อผู้ใช้</label>
          <input id="usernameInput" name="username" type="text" maxlength="32" placeholder="เช่น somchai" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="next" required />
        </div>
        <div class="field-group">
          <div class="field-label-row">
            <label for="passwordInput">รหัสผ่าน</label>
            <span id="passwordHint" class="field-hint">อย่างน้อย 8 ตัวอักษร</span>
          </div>
          <div class="password-wrap">
            <input id="passwordInput" name="password" type="password" minlength="8" maxlength="128" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" aria-describedby="passwordHint" enterkeyhint="done" required />
            <button type="button" id="togglePasswordBtn" class="password-toggle" aria-pressed="false" aria-label="แสดงรหัสผ่าน" title="แสดงหรือซ่อนรหัสผ่าน">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
        </div>
        <button id="loginBtn" type="submit" class="primary-btn">เข้าสู่ระบบ</button>
      </form>

      <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
      <div class="login-foot">ปลอดภัยด้วยการเข้ารหัสรหัสผ่านแบบ PBKDF2</div>
    </div>
  </div>

  <div id="shell" class="shell" hidden>
    <nav class="rail" id="rail" aria-label="เซิร์ฟเวอร์"></nav>
    <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

    <aside class="sidebar" id="sidebar" aria-label="รายการช่องสนทนา">
      <header class="server-header" id="serverHeader"></header>
      <div class="channel-scroll" id="channelList"></div>
      <div class="voice-panel" id="voicePanel" hidden></div>
      <div class="voice-bar" id="voiceBar" hidden></div>
      <div class="user-panel" id="userPanel"></div>
    </aside>

    <main class="chat">
      <header class="chat-header" id="chatHeader"></header>
      <section class="meeting-stage" id="meetingStage" hidden aria-label="ห้องประชุมเสียง"></section>
      <div id="meetingAudio" hidden></div>
      <div class="message-scroll" id="messageScroll">
        <div class="channel-intro" id="channelIntro"></div>
        <div id="messageList"></div>
      </div>
      <button type="button" class="jump-btn" id="jumpBtn" hidden>ไปยังข้อความล่าสุด</button>
      <div class="typing-row" id="typingRow" aria-live="polite"></div>
      <div class="composer-wrap">
        <div class="reply-bar" id="replyBar" hidden></div>
        <div class="emoji-picker" id="emojiPicker" hidden></div>
        <div class="composer" id="composer">
          <button type="button" class="composer-add" id="attachBtn" title="แทรกรูปแบบข้อความ" aria-label="แทรกรูปแบบข้อความ">+</button>
          <textarea id="messageInput" rows="1" maxlength="2000" placeholder="ส่งข้อความ..." aria-label="พิมพ์ข้อความ" enterkeyhint="send" spellcheck="false"></textarea>
          <span class="char-count" id="charCount" hidden></span>
          <button type="button" class="send-btn" id="sendBtn" title="ส่งข้อความ (Enter)" aria-label="ส่งข้อความ"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
        </div>
        <div class="composer-hint">
          <span class="hint-keys"><kbd>Enter</kbd> ส่ง · <kbd>Shift+Enter</kbd> ขึ้นบรรทัดใหม่</span>
          <span id="connStatus" class="conn-status">กำลังเชื่อมต่อ…</span>
        </div>
      </div>
    </main>

    <aside class="members" id="memberList" aria-label="สมาชิก"></aside>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="profile-popout" id="profilePopout" hidden></div>
  <div class="dropdown" id="dropdown" hidden></div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">สร้างใหม่</h2>
      <p id="modalDesc"></p>
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" id="modalCancel">ยกเลิก</button>
        <button type="button" class="primary-btn" id="modalSubmit">สร้าง</button>
      </div>
      <p class="modal-error" id="modalError" role="alert" aria-live="polite"></p>
    </div>
  </div>

  <div class="modal-backdrop" id="settingsBackdrop" hidden>
    <div class="modal settings-modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <h2 id="settingsTitle">ตั้งค่าผู้ใช้และธีม</h2>
        <button class="icon-btn" id="settingsClose" title="ปิด (Esc)" aria-label="ปิดหน้าต่างตั้งค่า">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <div class="settings-tabs" role="tablist">
        <button type="button" class="settings-tab active" data-settings-tab="profile" role="tab" aria-selected="true">โปรไฟล์และบัญชี</button>
        <button type="button" class="settings-tab" data-settings-tab="appearance" role="tab" aria-selected="false">การแสดงผลและธีม</button>
      </div>

      <div class="settings-pane" id="settingsPaneProfile">
        <div class="settings-profile-preview">
          <div class="sp-banner" id="spBanner"></div>
          <div class="sp-row">
            <span class="avatar lg" id="spAvatar">OB</span>
            <div class="sp-meta">
              <b id="spDisplayName">ชื่อที่แสดง</b>
              <span id="spUsername">@username</span>
            </div>
          </div>
        </div>

        <label for="settingsDisplayName">ชื่อที่แสดง</label>
        <input id="settingsDisplayName" type="text" maxlength="32" placeholder="ชื่อที่แสดง (1-32 ตัวอักษร)" />

        <label>สีอวาตาร์และแบนเนอร์</label>
        <div class="color-swatches" id="avatarColorSwatches"></div>
        <div class="custom-color-inline">
          <input type="color" id="settingsAvatarColorPicker" value="#5865f2" aria-label="เลือกสีอวาตาร์" />
          <input type="text" id="settingsAvatarColorHex" maxlength="7" placeholder="#5865f2" aria-label="รหัสสีอวาตาร์" />
        </div>

        <label for="settingsStatusSelect">สถานะการออนไลน์</label>
        <select id="settingsStatusSelect">
          <option value="online">ออนไลน์</option>
          <option value="idle">ไม่อยู่</option>
          <option value="dnd">ห้ามรบกวน</option>
          <option value="invisible">ซ่อนตัว</option>
        </select>

        <div class="settings-actions">
          <button type="button" class="ghost-btn danger-text" id="settingsLogoutBtn">ออกจากระบบ</button>
          <button type="button" class="primary-btn" id="saveProfileBtn">บันทึกโปรไฟล์</button>
        </div>
      </div>

      <div class="settings-pane" id="settingsPaneAppearance" hidden>
        <label>ชุดธีมสำเร็จรูป</label>
        <div class="theme-grid" id="themePresetGrid">
          <button type="button" class="theme-card" data-theme-preset="dark">
            <span class="tc-preview tc-dark" aria-hidden="true"><span class="tc-rail"></span><span class="tc-side"></span><span class="tc-main"><i></i><u></u></span></span>
            <span class="tc-name">Dark</span>
          </button>
          <button type="button" class="theme-card" data-theme-preset="light">
            <span class="tc-preview tc-light" aria-hidden="true"><span class="tc-rail"></span><span class="tc-side"></span><span class="tc-main"><i></i><u></u></span></span>
            <span class="tc-name">Light</span>
          </button>
          <button type="button" class="theme-card" data-theme-preset="slate">
            <span class="tc-preview tc-slate" aria-hidden="true"><span class="tc-rail"></span><span class="tc-side"></span><span class="tc-main"><i></i><u></u></span></span>
            <span class="tc-name">Slate</span>
          </button>
          <button type="button" class="theme-card" data-theme-preset="forest">
            <span class="tc-preview tc-forest" aria-hidden="true"><span class="tc-rail"></span><span class="tc-side"></span><span class="tc-main"><i></i><u></u></span></span>
            <span class="tc-name">Forest</span>
          </button>
          <button type="button" class="theme-card" data-theme-preset="midnight">
            <span class="tc-preview tc-midnight" aria-hidden="true"><span class="tc-rail"></span><span class="tc-side"></span><span class="tc-main"><i></i><u></u></span></span>
            <span class="tc-name">Midnight</span>
          </button>
          <button type="button" class="theme-card" data-theme-preset="amber">
            <span class="tc-preview tc-amber" aria-hidden="true"><span class="tc-rail"></span><span class="tc-side"></span><span class="tc-main"><i></i><u></u></span></span>
            <span class="tc-name">Amber</span>
          </button>
          <button type="button" class="theme-card" data-theme-preset="custom">
            <span class="tc-preview tc-custom" aria-hidden="true"><span class="tc-rail"></span><span class="tc-side"></span><span class="tc-main"><i></i><u></u></span></span>
            <span class="tc-name">กำหนดเอง</span>
          </button>
        </div>

        <div class="palette-head">
          <label>ปรับแต่งชุดสีด้วยตัวเอง</label>
          <span id="customContrastNote" class="palette-contrast-note"></span>
        </div>
        <div class="palette-controls">
          <div class="palette-field">
            <span>สีหลัก (Brand)</span>
            <div class="palette-inputs">
              <input type="color" id="customBrandPicker" value="#5865f2" aria-label="สีหลัก" />
              <input type="text" id="customBrandHex" maxlength="7" value="#5865f2" aria-label="รหัสสีหลัก" />
            </div>
          </div>
          <div class="palette-field">
            <span>สีแถบข้าง (Sidebar)</span>
            <div class="palette-inputs">
              <input type="color" id="customSidebarPicker" value="#2b2d31" aria-label="สีแถบข้าง" />
              <input type="text" id="customSidebarHex" maxlength="7" value="#2b2d31" aria-label="รหัสสีแถบข้าง" />
            </div>
          </div>
          <div class="palette-field">
            <span>สีพื้นหลังแชท (Chat)</span>
            <div class="palette-inputs">
              <input type="color" id="customChatPicker" value="#313338" aria-label="สีพื้นหลังแชท" />
              <input type="text" id="customChatHex" maxlength="7" value="#313338" aria-label="รหัสสีพื้นหลังแชท" />
            </div>
          </div>
        </div>

        <div class="settings-actions">
          <button type="button" class="ghost-btn" id="resetThemeBtn">รีเซ็ตค่าเริ่มต้น</button>
          <button type="button" class="primary-btn" id="saveThemeBtn">บันทึกธีม</button>
        </div>
      </div>

      <p class="modal-error" id="settingsError"></p>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
